# Decap CMS configuration for rudeepramesh.com
# Login is handled by DecapBridge. Content lives in content/site.json and
# content/projects/. Only edit this file if you know what you're doing.

# Use DecapBridge PKCE auth
backend:
  name: git-gateway
  repo: Rude07/rudeepramesh.com
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/be7e7ca0-6435-4e15-972b-92225dc7dd22/pkce
  auth_token_endpoint: /sites/be7e7ca0-6435-4e15-972b-92225dc7dd22/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# DecapBridge login field claims
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Local editing without login:
#   1) in the site folder run:  npx decap-server
#   2) in another terminal run: npx serve
#   3) open http://localhost:3000/admin
local_backend: true

media_folder: "images/uploads"
public_folder: "/images/uploads"

site_url: https://rudeepramesh.com
display_url: https://rudeepramesh.com

collections:
  - name: "projects"
    label: "Case Study Projects"
    label_singular: "Project"
    description: "Each project becomes its own page at /work/<name>/. Add, edit or delete freely."
    folder: "content/projects"
    create: true
    delete: true
    extension: "json"
    format: "json"
    identifier_field: "title"
    slug: "{{slug}}"
    summary: "{{fields.order}} — {{fields.title}}"
    sortable_fields: ["order", "title", "year"]
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Display order (lower = first)", name: "order", widget: "number", default: 10, value_type: "int" }
      - { label: "Show on homepage as featured", name: "featured", widget: "boolean", default: false }
      - { label: "Client", name: "client", widget: "string", required: false }
      - { label: "Your role", name: "role", widget: "string", required: false }
      - { label: "Year", name: "year", widget: "string", required: false }
      - { label: "Category / type", name: "category", widget: "string", hint: "e.g. Ad Film, Testimonial Film, Short Film" }
      - { label: "Thumbnail image", name: "thumb", widget: "image" }
      - { label: "Video link (Drive / YouTube)", name: "videoUrl", widget: "string" }
      - { label: "Video upload date", name: "videoUploadDate", widget: "datetime", required: false, format: "YYYY-MM-DD", date_format: "DD MMM YYYY", time_format: false, hint: "The date the video went live on YouTube. Google uses it for video search results; leave empty rather than guess." }
      - { label: "Video length", name: "videoDuration", widget: "string", required: false, hint: "Minutes:seconds as on YouTube, e.g. 7:55 or 0:43." }
      - { label: "One-line summary (used for Google description)", name: "summary", widget: "text" }
      - { label: "Overview", name: "overview", widget: "text", required: false }
      - { label: "The challenge", name: "challenge", widget: "text", required: false }
      - { label: "Approach", name: "approach", widget: "text", required: false }
      - { label: "Outcome / results", name: "results", widget: "text", required: false }
      - { label: "Tools used", name: "tools", widget: "list", required: false, allow_add: true }

  - name: "site"
    label: "Website Content"
    files:
      - name: "content"
        label: "Edit Site (all sections)"
        file: "content/site.json"
        fields:

          - label: "SEO & Search"
            name: "seo"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Browser / Google title", name: "title", widget: "string" }
              - { label: "Google description (max ~155 chars)", name: "description", widget: "text" }
              - { label: "Canonical URL", name: "canonical", widget: "string", hint: "Your live domain, no trailing slash" }
              - { label: "Social preview image", name: "ogImage", widget: "image", allow_multiple: false }

          - label: "Identity / Schema (Google Knowledge Graph)"
            name: "schema"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Full name", name: "name", widget: "string" }
              - { label: "Short name", name: "alternateName", widget: "string" }
              - { label: "Job title", name: "jobTitle", widget: "string" }
              - { label: "Works for", name: "worksFor", widget: "string" }
              - { label: "Works for: website", name: "worksForUrl", widget: "string", required: false, hint: "Your employer's homepage, e.g. https://ebsedu.org. Helps Google connect you to the organisation." }
              - { label: "City", name: "locality", widget: "string" }
              - { label: "State", name: "region", widget: "string" }
              - { label: "Country code", name: "country", widget: "string" }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Bio for Google (2–3 sentences)", name: "description", widget: "text" }
              - { label: "Skills / topics (knowsAbout)", name: "knowsAbout", widget: "list", allow_add: true }
              - label: "Social profile URLs (sameAs — keep in sync with your real profiles!)"
                name: "sameAs"
                widget: "list"
                allow_add: true
                hint: "LinkedIn, Instagram, YouTube, Behance, Wikidata… full URLs"

          - label: "Theme"
            name: "theme"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Accent color", name: "accent", widget: "color" }
              - { label: "Film grain overlay", name: "filmGrain", widget: "boolean" }

          - label: "Navigation"
            name: "nav"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Logo name", name: "name", widget: "string" }
              - { label: "Logo suffix", name: "suffix", widget: "string" }

          - label: "Hero"
            name: "hero"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Role line", name: "role", widget: "string" }
              - { label: "First name (big)", name: "firstName", widget: "string" }
              - { label: "Last name (outlined)", name: "lastName", widget: "string" }
              - { label: "Tagline", name: "tagline", widget: "text", hint: "Keep it under 20 words so the hero fits on one screen." }
              - label: "Hero reel (full-screen background behind your name)"
                name: "reel"
                widget: "object"
                collapsed: true
                hint: "Upload a showreel video and it fills the whole first screen behind your name, muted and looping. With no video, the background cross-fades through stills."
                fields:
                  - { label: "Show the background", name: "enabled", widget: "boolean", default: true, hint: "Turn off to go back to the plain dark hero with the moving blue glows. Your video and stills stay saved for later." }
                  - { label: "Showreel video (optional)", name: "video", widget: "file", required: false, default: "", hint: "MP4 (H.264), 16:9, 1920x1080, 10-20 seconds, no sound needed, ideally under 10 MB. The left side sits under a dark fade so the name stays readable, so keep the action centre or right. It plays muted on a loop and pauses when scrolled away. Visitors who ask for reduced motion see the poster instead." }
                  - { label: "Poster image (optional)", name: "poster", widget: "image", required: false, default: "", hint: "Shown while the video loads and for reduced-motion visitors. 16:9, about 1280x720. Leave empty to use the first still. Avoid images with text on them, they sit behind your name." }
                  - { label: "Full showreel link (optional)", name: "link", widget: "string", required: false, default: "#work", hint: "Optional. Paste a YouTube or Vimeo link to your full showreel and a Watch showreel button appears in the hero. Leave as #work for no button." }
                  - label: "Stills (used only when there is no video)"
                    name: "stills"
                    widget: "list"
                    required: false
                    default: []
                    hint: "Up to 5 images, 16:9, at least 1920 wide (they fill the screen). Pick frames without titles or text, since they sit behind your name. Leave empty to use the film thumbnails automatically."
                    field: { label: "Image", name: "image", widget: "image" }

          - label: "Marquee band words"
            name: "marquee"
            widget: "list"
            allow_add: true
            collapsed: true

          - { label: "Brands strip heading", name: "brandsLabel", widget: "string", required: false }
          - label: "Brands / clients (scrolling logo strip)"
            name: "brands"
            widget: "list"
            collapsed: true
            summary: "{{fields.name}}"
            hint: "Upload a logo (transparent PNG/SVG works best). If no logo, the name shows as text."
            fields:
              - { label: "Brand name", name: "name", widget: "string" }
              - { label: "Logo image (optional)", name: "logo", widget: "image", required: false }

          - label: "Featured Work (big card)"
            name: "featured"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "string" }
              - { label: "Byline", name: "byline", widget: "string" }
              - { label: "Frame label", name: "frame", widget: "string" }
              - { label: "Badge left", name: "badgeLeft", widget: "string" }
              - { label: "Badge right", name: "badgeRight", widget: "string" }
              - { label: "Video link", name: "href", widget: "string" }
              - { label: "Thumbnail", name: "thumb", widget: "image", allow_multiple: false }
              - label: "Link to case study"
                name: "caseStudyLink"
                widget: "select"
                required: false
                default: "auto"
                options:
                  - { label: "Auto: link to the case study that uses the same YouTube video", value: "auto" }
                  - { label: "On: link to the case study picked below", value: "manual" }
                  - { label: "Off: always open the video link", value: "off" }
                hint: "With a case study linked, the card opens that page on your site (label CASE STUDY) instead of YouTube or Drive (label WATCH). Auto needs the same YouTube video in both places."
              - label: "Case study page (used when On)"
                name: "caseStudy"
                widget: "relation"
                collection: "projects"
                value_field: "{{slug}}"
                search_fields: ["title"]
                display_fields: ["title"]
                required: false
                hint: "Only used when Link to case study is On. If that page is deleted later, the card falls back to Auto."

          - label: "Films (main grid)"
            name: "films"
            widget: "list"
            collapsed: true
            summary: "{{fields.num}} — {{fields.title}}"
            fields:
              - { label: "Number", name: "num", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Tag line", name: "tag", widget: "string" }
              - { label: "Frame label", name: "frame", widget: "string" }
              - { label: "Badge", name: "badge", widget: "string" }
              - { label: "Video link", name: "href", widget: "string" }
              - { label: "Thumbnail", name: "thumb", widget: "image", allow_multiple: false }
              - label: "Link to case study"
                name: "caseStudyLink"
                widget: "select"
                required: false
                default: "auto"
                options:
                  - { label: "Auto: link to the case study that uses the same YouTube video", value: "auto" }
                  - { label: "On: link to the case study picked below", value: "manual" }
                  - { label: "Off: always open the video link", value: "off" }
                hint: "With a case study linked, the card opens that page on your site (label CASE STUDY) instead of YouTube or Drive (label WATCH). Auto needs the same YouTube video in both places."
              - label: "Case study page (used when On)"
                name: "caseStudy"
                widget: "relation"
                collection: "projects"
                value_field: "{{slug}}"
                search_fields: ["title"]
                display_fields: ["title"]
                required: false
                hint: "Only used when Link to case study is On. If that page is deleted later, the card falls back to Auto."

          - label: "Reels & Social (vertical grid)"
            name: "reels"
            widget: "list"
            collapsed: true
            summary: "{{fields.num}} — {{fields.title}}"
            fields:
              - { label: "Number", name: "num", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Tag line", name: "tag", widget: "string" }
              - { label: "Frame label", name: "frame", widget: "string" }
              - { label: "★ Featured badge", name: "highlight", widget: "boolean", default: false }
              - { label: "Reel link", name: "href", widget: "string" }
              - { label: "Thumbnail", name: "thumb", widget: "image", allow_multiple: false }

          - label: "About"
            name: "about"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Portrait photo", name: "portrait", widget: "image", allow_multiple: false }
              - { label: "Portrait caption: name (not shown at the moment)", name: "captionName", widget: "string", required: false }
              - { label: "Portrait caption: location (not shown at the moment)", name: "captionLocation", widget: "string", required: false }
              - { label: "Bio (HTML allowed for accent highlights)", name: "bio", widget: "text", hint: 'Wrap words in <span style="color:var(--ac);">…</span> to highlight them' }
              - { label: "Based in", name: "basedIn", widget: "string" }
              - { label: "Languages", name: "languages", widget: "string" }
              - { label: "Also", name: "also", widget: "string" }
              - label: "Stats"
                name: "stats"
                widget: "list"
                fields:
                  - { label: "Value", name: "value", widget: "string" }
                  - { label: "Label", name: "label", widget: "string" }

          - label: "Experience"
            name: "experience"
            widget: "list"
            collapsed: true
            summary: "{{fields.role}} {{fields.org}}"
            fields:
              - { label: "Period", name: "period", widget: "string" }
              - { label: "Location", name: "location", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Organisation", name: "org", widget: "string", hint: 'Written after the role, so start with "at", e.g. "at Eaton Business School".' }
              - { label: "Description", name: "desc", widget: "text" }
              - { label: "Button label (optional)", name: "linkLabel", widget: "string", required: false, default: "" }
              - { label: "Button link (optional)", name: "linkHref", widget: "string", required: false, default: "" }

          - label: "Toolkit / Skills"
            name: "skills"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Big topline tools", name: "topline", widget: "list", allow_add: true }
              - label: "Skill groups"
                name: "groups"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - { label: "Group title", name: "title", widget: "string" }
                  - { label: "Items", name: "items", widget: "list", allow_add: true }
              - { label: "AI section title", name: "aiTitle", widget: "string" }
              - { label: "AI tools", name: "aiTools", widget: "list", allow_add: true }

          - label: "Contact"
            name: "contact"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Heading line 1", name: "headingLine1", widget: "string" }
              - { label: "Heading line 2", name: "headingLine2", widget: "string" }
              - { label: "Heading accent word", name: "headingAccent", widget: "string" }
              - label: "Background image (optional)"
                name: "background"
                widget: "object"
                collapsed: true
                required: false
                hint: "A photo behind the contact section, under a dark fade so the heading and links stay readable. Leave the image empty for the plain dark section."
                fields:
                  - { label: "Image", name: "image", widget: "image", required: false, default: "", hint: "Landscape, at least 1920 wide. JPG or WebP under 500 KB loads fastest. Keep the subject on the right: the heading and links sit on the left." }
                  - label: "Darkness"
                    name: "darkness"
                    widget: "select"
                    required: false
                    default: "medium"
                    options:
                      - { label: "Light (photo shows strongly)", value: "light" }
                      - { label: "Medium", value: "medium" }
                      - { label: "Strong (photo is subtle)", value: "strong" }
                  - label: "Image focus"
                    name: "position"
                    widget: "select"
                    required: false
                    default: "center"
                    hint: "Which part of the photo stays in frame when the screen crops it (phones crop the sides)."
                    options:
                      - { label: "Centre", value: "center" }
                      - { label: "Left", value: "left" }
                      - { label: "Right", value: "right" }
                      - { label: "Top", value: "top" }
                      - { label: "Bottom", value: "bottom" }
              - label: "Contact rows"
                name: "links"
                widget: "list"
                summary: "{{fields.label}} — {{fields.value}}"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Shown value", name: "value", widget: "string" }
                  - { label: "Link (mailto:, tel:, or https://)", name: "href", widget: "string" }

          - label: "Footer"
            name: "footer"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Copyright", name: "copyright", widget: "string" }
              - { label: "Location line", name: "location", widget: "string" }
